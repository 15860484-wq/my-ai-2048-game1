
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#faf8ef" />
  <title>2048 — 數字合併遊戲</title>

  <style>
    :root {
      --bg: #faf8ef;
      --board: #bbada0;
      --text: #776e65;
      --empty: rgba(238, 228, 218, 0.35);
      --accent: #edc22e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px 36px;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    .game {
      width: min(100%, 480px);
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 10vw, 64px);
      line-height: 1;
      font-weight: 850;
      letter-spacing: -3px;
      color: #776e65;
    }

    .scores {
      display: flex;
      gap: 7px;
    }

    .score-box {
      min-width: 82px;
      padding: 10px 12px;
      text-align: center;
      background: #bbada0;
      color: white;
      border-radius: 9px;
    }

    .score-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      opacity: 0.85;
      white-space: nowrap;
    }

    .score-value {
      display: block;
      margin-top: 3px;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.2;
    }

    .intro {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .intro p {
      margin: 0;
      font-size: 14px;
      line-height: 1.7;
    }

    .restart {
      flex-shrink: 0;
      border: 0;
      border-radius: 8px;
      padding: 12px 15px;
      color: white;
      background: #8f7a66;
      font-weight: 750;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .restart:hover {
      background: #776452;
    }

    .restart:active {
      transform: scale(0.96);
    }

    .board-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      padding: 10px;
      background: var(--board);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(119, 110, 101, 0.12);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
      height: 100%;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      border-radius: 7px;
      background: var(--empty);
      font-size: clamp(20px, 6.5vw, 36px);
      font-weight: 800;
      letter-spacing: -1px;
      transition:
        background-color 0.12s ease,
        color 0.12s ease;
    }

    .cell.filled {
      animation: appear 0.13s ease-out;
    }

    .cell.merged {
      animation: merge 0.16s ease-out;
    }

    @keyframes appear {
      from {
        transform: scale(0.78);
        opacity: 0.5;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes merge {
      0% { transform: scale(0.86); }
      55% { transform: scale(1.09); }
      100% { transform: scale(1); }
    }

    .tile-2    { background: #eee4da; color: #776e65; }
    .tile-4    { background: #ede0c8; color: #776e65; }
    .tile-8    { background: #f2b179; color: #fffaf4; }
    .tile-16   { background: #f59563; color: #fffaf4; }
    .tile-32   { background: #f67c5f; color: #fffaf4; }
    .tile-64   { background: #f65e3b; color: #fffaf4; }
    .tile-128  { background: #edcf72; color: #fffaf4; font-size: clamp(18px, 5.5vw, 30px); }
    .tile-256  { background: #edcc61; color: #fffaf4; font-size: clamp(18px, 5.5vw, 30px); }
    .tile-512  { background: #edc850; color: #fffaf4; font-size: clamp(18px, 5.5vw, 30px); }
    .tile-1024 { background: #edc53f; color: #fffaf4; font-size: clamp(15px, 4.5vw, 25px); }
    .tile-2048 { background: #edc22e; color: #fffaf4; font-size: clamp(15px, 4.5vw, 25px); }

    .tile-super {
      background: #3c3a32;
      color: white;
      font-size: clamp(14px, 4vw, 24px);
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      border-radius: 12px;
      background: rgba(250, 248, 239, 0.84);
      backdrop-filter: blur(3px);
      text-align: center;
    }

    .overlay[hidden] {
      display: none;
    }

    .overlay-content h2 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    .overlay-content p {
      margin: 0 0 18px;
      line-height: 1.7;
    }

    .overlay-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .overlay-actions button {
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      background: #8f7a66;
      color: white;
      font-weight: 750;
      cursor: pointer;
    }

    .overlay-actions .secondary {
      background: #d8cec2;
      color: #574e45;
    }

    .instructions {
      margin-top: 24px;
      font-size: 14px;
      line-height: 1.9;
    }

    .instructions strong {
      color: #574e45;
    }

    .key {
      display: inline-block;
      min-width: 27px;
      margin: 0 2px;
      padding: 1px 6px;
      border: 1px solid #d6cec5;
      border-radius: 5px;
      background: #fffdf8;
      text-align: center;
      font-weight: 700;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      color: #a69a8e;
      font-size: 12px;
    }

    @media (max-width: 380px) {
      body {
        padding: 20px 12px 28px;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .scores {
        width: 100%;
      }

      .score-box {
        flex: 1;
      }

      .board-wrap {
        padding: 7px;
      }

      .board {
        gap: 7px;
      }

      .intro p {
        font-size: 13px;
      }

      .restart {
        padding: 10px 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="game">
    <header class="header">
      <h1>2048</h1>

      <div class="scores">
        <div class="score-box">
          <div class="score-label">目前分數</div>
          <output id="score" class="score-value">0</output>
        </div>

        <div class="score-box">
          <div class="score-label">最高分數</div>
          <output id="best" class="score-value">0</output>
        </div>
      </div>
    </header>

    <section class="intro">
      <p>
        合併相同數字，挑戰 <strong>2048</strong>！<br />
        每一步，都要替未來留一點空間。
      </p>

      <button id="restart" class="restart" type="button">
        ↻ 重新開始
      </button>
    </section>

    <section
      id="boardWrap"
      class="board-wrap"
      aria-label="2048 遊戲區域"
    >
      <div
        id="board"
        class="board"
        role="grid"
        aria-label="遊戲棋盤"
      ></div>

      <div id="overlay" class="overlay" hidden>
        <div class="overlay-content">
          <h2 id="overlayTitle">2048！</h2>
          <p id="overlayText">你成功合成 2048 了！</p>

          <div class="overlay-actions">
            <button id="continueBtn" type="button">
              繼續遊戲
            </button>
            <button id="overlayRestart" class="secondary" type="button">
              重新開始
            </button>
          </div>
        </div>
      </div>
    </section>

    <section class="instructions">
      <strong>遊戲方式</strong><br />
      電腦：使用
      <span class="key">↑</span>
      <span class="key">↓</span>
      <span class="key">←</span>
      <span class="key">→</span>
      或 WASD 移動方塊。<br />
      手機：在棋盤上向上、下、左、右滑動。<br />
      相同數字碰在一起時會合併，合併後的數字就是得分。
      當棋盤沒有空格，而且沒有任何可合併的方塊時，遊戲結束。
    </section>

    <footer class="footer">
      Built with HTML5 · CSS3 · Vanilla JavaScript
    </footer>
  </main>

  <script>
    "use strict";

    // ===== 遊戲設定 =====
    const SIZE = 4;
    const WIN_TILE = 2048;
    const STORAGE_KEY = "vanilla2048-best";

    const boardElement = document.getElementById("board");
    const boardWrap = document.getElementById("boardWrap");
    const scoreElement = document.getElementById("score");
    const bestElement = document.getElementById("best");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayText = document.getElementById("overlayText");
    const continueBtn = document.getElementById("continueBtn");

    let board = [];
    let score = 0;
    let best = loadBest();
    let won = false;
    let keepPlaying = false;
    let gameOver = false;

    // 以 CSS Grid 顯示 16 個格子。
    const cells = [];

    for (let i = 0; i < SIZE * SIZE; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.setAttribute("role", "gridcell");
      boardElement.appendChild(cell);
      cells.push(cell);
    }

    function loadBest() {
      try {
        const value = Number(localStorage.getItem(STORAGE_KEY));
        return Number.isFinite(value) && value >= 0 ? value : 0;
      } catch (error) {
        // 瀏覽器禁止存取 LocalStorage 時仍可遊玩。
        return 0;
      }
    }

    function saveBest() {
      try {
        localStorage.setItem(STORAGE_KEY, String(best));
      } catch (error) {
        // 私密瀏覽或儲存空間受限時不影響遊戲。
      }
    }

    function emptyBoard() {
      return Array.from(
        { length: SIZE },
        () => Array(SIZE).fill(0)
      );
    }

    function addRandomTile() {
      const empty = [];

      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === 0) {
            empty.push([r, c]);
          }
        }
      }

      if (empty.length === 0) return;

      const [r, c] = empty[
        Math.floor(Math.random() * empty.length)
      ];

      // 新方塊有 90% 機率是 2，10% 機率是 4。
      board[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function updateScores() {
      scoreElement.textContent = score.toLocaleString();
      bestElement.textContent = best.toLocaleString();
    }

    function render(animations = {}) {
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const i = r * SIZE + c;
          const value = board[r][c];
          const cell = cells[i];

          cell.className = "cell";

          if (value !== 0) {
            cell.textContent = value;
            cell.classList.add(
              value <= 2048 ? `tile-${value}` : "tile-super"
            );

            if (animations.spawn?.has(i)) {
              cell.classList.add("filled");
            }

            if (animations.merged?.has(i)) {
              cell.classList.add("merged");
            }
          } else {
            cell.textContent = "";
          }

          cell.setAttribute(
            "aria-label",
            value ? `第 ${r + 1} 列，第 ${c + 1} 欄，${value}` :
                    `第 ${r + 1} 列，第 ${c + 1} 欄，空格`
          );
        }
      }

      updateScores();
    }

    function showOverlay(title, message, canContinue) {
      overlayTitle.textContent = title;
      overlayText.textContent = message;
      continueBtn.hidden = !canContinue;
      overlay.hidden = false;
    }

    function hideOverlay() {
      overlay.hidden = true;
    }

    function startGame() {
      board = emptyBoard();
      score = 0;
      won = false;
      keepPlaying = false;
      gameOver = false;

      hideOverlay();
      addRandomTile();
      addRandomTile();
      render({
        spawn: new Set(
          board.flatMap((row, r) =>
            row.map((v, c) => v ? r * SIZE + c : -1)
          ).filter(i => i >= 0)
        )
      });
    }

    // 將一列向左移動，且每個數字每回合最多合併一次。
    function slideRow(row) {
      const original = row.slice();
      const values = row.filter(value => value !== 0);
      const result = [];
      let gained = 0;
      let mergeCount = 0;

      for (let i = 0; i < values.length; i++) {
        if (values[i] === values[i + 1]) {
          const mergedValue = values[i] * 2;
          result.push(mergedValue);
          gained += mergedValue;
          mergeCount++;
          i++;
        } else {
          result.push(values[i]);
        }
      }

      while (result.length < SIZE) {
        result.push(0);
      }

      return {
        row: result,
        gained,
        mergeCount,
        changed: result.some((v, i) => v !== original[i])
      };
    }

    function getLine(direction, index) {
      const line = [];

      for (let j = 0; j < SIZE; j++) {
        if (direction === "left") {
          line.push(board[index][j]);
        } else if (direction === "right") {
          line.push(board[index][SIZE - 1 - j]);
        } else if (direction === "up") {
          line.push(board[j][index]);
        } else {
          line.push(board[SIZE - 1 - j][index]);
        }
      }

      return line;
    }

    function setLine(direction, index, line) {
      for (let j = 0; j < SIZE; j++) {
        if (direction === "left") {
          board[index][j] = line[j];
        } else if (direction === "right") {
          board[index][SIZE - 1 - j] = line[j];
        } else if (direction === "up") {
          board[j][index] = line[j];
        } else {
          board[SIZE - 1 - j][index] = line[j];
        }
      }
    }

    function move(direction) {
      if (gameOver || (!keepPlaying && won)) return;

      let changed = false;
      let gained = 0;

      for (let i = 0; i < SIZE; i++) {
        const result = slideRow(getLine(direction, i));
        if (result.changed) changed = true;
        gained += result.gained;
        setLine(direction, i, result.row);
      }

      // 沒有移動就不產生新方塊。
      if (!changed) return;

      score += gained;

      if (score > best) {
        best = score;
        saveBest();
      }

      const previousWin = won;

      if (!won && board.some(row => row.some(v => v >= WIN_TILE))) {
        won = true;
      }

      addRandomTile();
      render();

      if (!previousWin && won) {
        showOverlay(
          "🎉 2048！",
          "恭喜！你成功合成 2048。還想繼續挑戰更大的數字嗎？",
          true
        );
        return;
      }

      if (!canMove()) {
        gameOver = true;
        showOverlay(
          "遊戲結束",
          `最終分數：${score.toLocaleString()}。再試一次，挑戰更高分！`,
          false
        );
      }
    }

    function canMove() {
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === 0) return true;

          if (
            c + 1 < SIZE &&
            board[r][c] === board[r][c + 1]
          ) return true;

          if (
            r + 1 < SIZE &&
            board[r][c] === board[r + 1][c]
          ) return true;
        }
      }

      return false;
    }

    // ===== 鍵盤操作 =====
    document.addEventListener("keydown", event => {
      const keyMap = {
        ArrowLeft: "left",
        ArrowRight: "right",
        ArrowUp: "up",
        ArrowDown: "down",
        a: "left",
        d: "right",
        w: "up",
        s: "down",
        A: "left",
        D: "right",
        W: "up",
        S: "down"
      };

      const direction = keyMap[event.key];

      if (!direction) return;

      event.preventDefault();
      move(direction);
    });

    // ===== 手機滑動操作 =====
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStarted = false;

    boardWrap.addEventListener("pointerdown", event => {
      if (event.pointerType === "mouse") return;

      touchStartX = event.clientX;
      touchStartY = event.clientY;
      touchStarted = true;
    });

    boardWrap.addEventListener("pointerup", event => {
      if (!touchStarted || event.pointerType === "mouse") return;

      touchStarted = false;

      const dx = event.clientX - touchStartX;
      const dy = event.clientY - touchStartY;
      const threshold = 25;

      if (Math.max(Math.abs(dx), Math.abs(dy)) < threshold) {
        return;
      }

      if (Math.abs(dx) > Math.abs(dy)) {
        move(dx > 0 ? "right" : "left");
      } else {
        move(dy > 0 ? "down" : "up");
      }
    });

    boardWrap.addEventListener("pointercancel", () => {
      touchStarted = false;
    });

    // ===== 按鈕 =====
    document.getElementById("restart").addEventListener(
      "click", startGame
    );

    document.getElementById("overlayRestart").addEventListener(
      "click", startGame
    );

    continueBtn.addEventListener("click", () => {
      keepPlaying = true;
      hideOverlay();
    });

    // 開始遊戲。
    bestElement.textContent = best.toLocaleString();
    startGame();
  </script>
</body>
</html>
